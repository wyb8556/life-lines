<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d0b24">
<title>1000万种人生里，你走的是哪一条线</title>
<meta name="description" content="50个问题，跳进另一个宇宙：恋爱人格、16型人格、爱情线、三条平行人生。仅供娱乐。">
<style>
/* 标题字体：得意黑 Smiley Sans 的子集（OFL-1.1，按协议改名为 LifeLines Display），只保留页面用到的字 */
@font-face {
  font-family: "LifeLines Display";
  src: url(fonts/lifelines-display.woff2) format("woff2");
  font-display: swap;
}
:root {
  /* 黑白 + 一个强调色。强调色只用于：进度、关键结论、主操作 */
  --bg: oklch(0.13 0 0);
  --surface: oklch(0.19 0 0 / 0.78);
  --line: oklch(1 0 0 / 0.14);
  --ink: oklch(0.97 0 0);
  --muted: oklch(0.76 0 0);
  --faint: oklch(0.6 0 0);
  --accent: oklch(0.76 0.15 35);
  --accent-soft: oklch(0.76 0.15 35 / 0.14);
  --glass: blur(14px);

  /* 字体：标题和大数字用得意黑；正文用系统黑体；HUD 小标签用系统等宽 */
  --display: "LifeLines Display", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --sans: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, "Roboto Mono", "Cascadia Mono", Consolas, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif;

  /* 6 档字号 */
  --t-xs: 12px;
  --t-sm: 14px;
  --t-md: 16px;
  --t-lg: 20px;
  --t-xl: 28px;
  --t-hero: clamp(2.5rem, 12vw, 3.25rem);

  --radius: 12px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);

  --z-canvas: 0;
  --z-content: 1;
  --z-toast: 10;
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--t-md);
  line-height: 1.75;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
h1, h2, h3 { text-wrap: balance; font-weight: 600; }
p { text-wrap: pretty; }
[hidden] { display: none !important; }

/* 三种字的角色 */
.intro-title, .r-type, .sec-title, .sub-title, .ch-title, .calc-title, .r-slogan, .r-16 b,
.share-hint, .paywall h2, .locked-list h3, .echo q, .script dd, .lifeline h3 .odds, .cta, .ch-next b {
  font-family: var(--display);
  font-weight: 400;
  letter-spacing: 0.02em;
}
.hud, .progress-meta, .q-tag, .ch-done, .r-universe, .calc-step, .calc-label, .r-letters, .fork span,
.mask span, .script dt, .ch-next span, .nodes .age, .r-type small, .chart text, .ring .node text, .bar-row span:last-child {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
}

.wrap {
  position: relative;
  z-index: var(--z-content);
  max-width: 460px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 32px);
}

/* ---------- 背景：封面照片 / 内页星轨漩涡 ---------- */
.scene { position: fixed; inset: 0; z-index: var(--z-canvas); overflow: hidden; pointer-events: none; }
#city { position: absolute; inset: -12px; animation: drift 14s ease-in-out infinite alternate; transition: opacity 0.6s; }
#city i { position: absolute; inset: 0; }
.city-sky { background: linear-gradient(to bottom, #2a1030 0%, #e8607a 46%, #e2609a 62%, #b356c4 82%, #6c4ad0 100%); }
/* 照片已预先上下翻转：楼顶朝下，天空在下方。底部渐隐接上天空渐变 */
.city-photo { bottom: 38% !important; background: url(city.jpg) 42% 100% / cover no-repeat; -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent); mask-image: linear-gradient(to bottom, #000 70%, transparent); }
.city-grade { background: linear-gradient(to bottom, #3b1446 0%, #ff6f8e 55%, #8a5cff 100%); mix-blend-mode: soft-light; opacity: 0.9; }
@keyframes drift { to { transform: translate3d(-6px, 8px, 0) scale(1.015); } }
#vortex { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transform: scale(1.5) rotate(-12deg); transition: opacity 0.9s var(--ease), transform 1.6s var(--ease); }
body:not([data-screen="intro"]) #vortex { opacity: 1; transform: none; }
body:not([data-screen="intro"]) #city { opacity: 0; }
.scrim { position: absolute; inset: 0; transition: opacity 0.8s var(--ease); }
.scrim-intro { background: linear-gradient(to bottom, transparent 0%, transparent 40%, oklch(0.1 0 0 / 0.5) 56%, oklch(0.1 0 0 / 0.86) 74%, oklch(0.1 0 0 / 0.97) 100%); }
.scrim-dim { background: linear-gradient(to bottom, oklch(0.08 0 0 / 0.45), oklch(0.08 0 0 / 0.52) 45%, oklch(0.08 0 0 / 0.74)); opacity: 0; }
body[data-screen="result"] .scrim-dim { background: oklch(0.08 0 0 / 0.84); }
body:not([data-screen="intro"]) .scrim-intro { opacity: 0; }
body:not([data-screen="intro"]) .scrim-dim { opacity: 1; }

.lines-canvas {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  z-index: var(--z-canvas);
  pointer-events: none;
}

/* ---------- 进入宇宙：震动 → 闪烁 → 白闪 → 黑场 ---------- */
.flash { position: fixed; inset: 0; z-index: var(--z-toast); pointer-events: none; opacity: 0; background: #fff; }
body.warping { overflow: hidden; }
body.warping .scene, body.warping #intro .wrap { animation: quake 1.05s linear both; }
body.warping .intro-body, body.warping .intro-top { animation: glitch 1.05s steps(1, end) both; }
body.warping .flash { animation: flash 1.6s linear both; }
@keyframes quake {
  0% { transform: none; }
  8% { transform: translate(-2px, 1px); }
  16% { transform: translate(3px, -2px) rotate(0.3deg); }
  24% { transform: translate(-4px, 3px); }
  32% { transform: translate(5px, -1px) rotate(-0.5deg); }
  40% { transform: translate(-7px, 4px) rotate(0.6deg); }
  48% { transform: translate(8px, -5px); }
  56% { transform: translate(-10px, 6px) rotate(-0.8deg); }
  64% { transform: translate(11px, -4px) rotate(0.9deg); }
  72% { transform: translate(-12px, 7px); }
  80% { transform: translate(10px, -8px) rotate(-1deg) scale(1.02); }
  90% { transform: translate(-6px, 5px) scale(1.05); }
  100% { transform: scale(1.08); }
}
@keyframes glitch {
  0% { filter: none; opacity: 1; }
  18% { filter: invert(1); text-shadow: -3px 0 #ff2a6d, 3px 0 #2de2e6; transform: translateX(-4px) skewX(-6deg); }
  26% { filter: none; transform: translateX(3px); }
  34% { filter: invert(1) contrast(2); transform: translateX(-2px) skewX(8deg); }
  42% { filter: none; text-shadow: 3px 0 #ff2a6d, -3px 0 #2de2e6; transform: none; }
  50% { filter: invert(1); transform: translateX(6px); }
  56% { filter: brightness(3); transform: translateX(-6px) skewX(-10deg); }
  62% { filter: invert(1); opacity: 0.6; }
  68% { opacity: 0; }
  74% { opacity: 1; filter: brightness(3); }
  80%, 100% { opacity: 0; }
}
@keyframes flash {
  0%, 58% { opacity: 0; background: #fff; }
  62% { opacity: 1; background: #fff; }
  68% { opacity: 1; background: #000; }
  72% { opacity: 1; background: #fff; }
  76%, 86% { opacity: 1; background: #000; }
  100% { opacity: 0; background: #000; }
}

/* ---------- 封面 ---------- */
#intro .wrap { min-height: 100dvh; display: flex; flex-direction: column; }
.intro-top { display: flex; align-items: center; gap: 8px; font-size: var(--t-xs); color: var(--ink); text-shadow: 0 1px 8px oklch(0 0 0 / 0.7); }
.sig { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); animation: blink 1.4s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
.intro-body { margin-top: auto; padding-bottom: 8px; }
.intro-title {
  font-size: var(--t-hero);
  line-height: 1.12;
  text-shadow: 0 2px 24px oklch(0 0 0 / 0.55);
}
.intro-title em { font-style: normal; color: var(--accent); }
.intro-sub { margin-top: 16px; color: var(--ink); opacity: 0.86; font-size: var(--t-sm); text-shadow: 0 1px 10px oklch(0 0 0 / 0.7); }
.intro-list {
  list-style: none; padding: 0;
  margin-top: 20px;
  display: flex; flex-wrap: wrap; gap: 8px;
}
.intro-list li {
  font-size: var(--t-xs);
  padding: 4px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: oklch(0 0 0 / 0.35);
}
.cta {
  display: block; width: 100%;
  margin-top: 24px;
  padding: 14px 20px;
  border-radius: var(--radius);
  background: var(--ink);
  color: var(--bg);
  font-size: var(--t-lg);
  transition: transform 0.2s var(--ease), opacity 0.2s;
}
.cta:active { transform: scale(0.98); }
.fine { margin-top: 12px; font-size: var(--t-xs); color: var(--muted); text-align: center; }
.credit { margin-top: 4px; font-size: var(--t-xs); color: var(--faint); text-align: center; }

/* ---------- 答题 ---------- */
.quiz-head { display: flex; align-items: center; gap: 14px; }
.back {
  width: 40px; height: 40px; flex: none;
  margin-left: -10px;
  display: grid; place-items: center;
  border-radius: 50%;
  color: var(--muted);
}
.back:active { background: var(--surface); }
.opt, .pg-btn, .mask, .paywall { -webkit-backdrop-filter: var(--glass); backdrop-filter: var(--glass); }
.progress { flex: 1; }
.progress-meta { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--muted); }
.progress-track { position: relative; height: 2px; margin-top: 6px; background: var(--line); border-radius: 2px; }
.progress-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.5s var(--ease);
}
.progress-fill::after {
  content: ""; position: absolute; right: -4px; top: -3px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.q-zone { margin-top: 44px; }
.q-tag { font-size: var(--t-xs); color: var(--faint); }
.q-text {
  margin-top: 8px;
  font-size: var(--t-lg); line-height: 1.55; font-weight: 600;
  min-height: 3.1em;
}
.opts { list-style: none; padding: 0; margin-top: 24px; display: grid; gap: 10px; }
.opt {
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: var(--t-md); line-height: 1.5;
  transition: border-color 0.2s, background-color 0.2s, transform 0.2s var(--ease);
  animation: rise 0.45s var(--ease) both;
}
.opt:active { transform: scale(0.985); }
.opt.picked { border-color: var(--accent); background: var(--accent-soft); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

/* ---------- 翻页 ---------- */
#quiz .wrap { padding-bottom: calc(env(safe-area-inset-bottom) + 110px); }
.pager {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: var(--z-content);
  max-width: 460px; margin: 0 auto;
  padding: 16px 20px calc(env(safe-area-inset-bottom) + 18px);
  display: flex; align-items: center; gap: 12px;
  background: linear-gradient(to top, oklch(0.08 0 0 / 0.92) 40%, transparent);
}
body:not([data-screen="quiz"]) .pager { display: none; }
.pg-btn {
  flex: none; width: 50px; height: 50px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  transition: opacity 0.2s, transform 0.2s var(--ease), border-color 0.2s, color 0.2s;
}
.pg-btn:active:not(:disabled) { transform: scale(0.92); }
.pg-btn:disabled { opacity: 0.28; cursor: default; }
#pg-next:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pg-hint { flex: 1; }
.pg-jump { flex: 1; height: 42px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: var(--t-sm); font-weight: 600; }
#q-zone.from-right { animation: from-right 0.38s var(--ease) both; }
#q-zone.from-left { animation: from-left 0.38s var(--ease) both; }
@keyframes from-right { from { opacity: 0; transform: translateX(36px); } }
@keyframes from-left { from { opacity: 0; transform: translateX(-36px); } }

/* ---------- 跃迁翻面：整屏（含背景）绕竖轴翻过去，再从背面翻回来 ---------- */
body.flip-out, body.flip-in { overflow: hidden; }
body.flip-out .scene, body.flip-out #quiz .wrap { animation: flip-out 0.4s cubic-bezier(0.55, 0, 0.8, 0.25) forwards; transform-origin: 50% 50%; }
body.flip-in .scene, body.flip-in #quiz .wrap { animation: flip-in 0.55s var(--ease) both; transform-origin: 50% 50%; }
@keyframes flip-out { to { transform: perspective(1100px) rotateY(90deg) scale(0.9); filter: brightness(1.8); } }
@keyframes flip-in { from { transform: perspective(1100px) rotateY(-90deg) scale(0.9); filter: brightness(1.8); } }

/* ---------- 章节过场 ---------- */
.ch-break { margin-top: 56px; animation: rise 0.5s var(--ease) both; }
.ch-dots { display: flex; gap: 6px; }
.ch-dots i { width: 22px; height: 3px; border-radius: 3px; background: var(--line); }
.ch-dots i.on { background: var(--accent); }
.ch-done { margin-top: 28px; font-size: var(--t-xs); color: var(--muted); }
.ch-title { margin-top: 6px; font-size: var(--t-xl); line-height: 1.25; outline: none; }
.ch-reward { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); color: var(--muted); }
.ch-reward svg { color: var(--ink); flex: none; }
.ch-next { margin-top: 44px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ch-next span { display: block; font-size: var(--t-xs); color: var(--faint); }
.ch-next b { display: block; margin-top: 4px; font-size: var(--t-lg); }

/* ---------- 结算 ---------- */
#calc .wrap { min-height: 100dvh; display: flex; flex-direction: column; }
.ring-box { position: relative; width: min(80vw, 320px); aspect-ratio: 1; margin: 6vh auto 0; }
.ring { width: 100%; height: 100%; display: block; overflow: visible; }
.ring .arc { transition: stroke-dasharray 0.6s var(--ease); }
.ring .node circle { transition: fill 0.3s, stroke 0.3s; }
.ring .node text { font-size: 10px; fill: var(--faint); transition: fill 0.3s; }
.ring .node.on circle { fill: var(--bg); stroke: var(--ink); }
.ring .node.on text { fill: var(--ink); }
.ring-icon { position: absolute; inset: 0; display: grid; place-items: center; }
.ring-icon svg { width: 32%; height: auto; animation: icon-in 0.55s var(--ease) both; filter: drop-shadow(0 0 14px oklch(1 0 0 / 0.25)); }
@keyframes icon-in { from { opacity: 0; transform: scale(0.82) rotate(-8deg); } }
.calc-text { margin-top: auto; padding-top: 32px; }
.calc-step { font-size: var(--t-xs); color: var(--muted); }
.calc-title { margin-top: 6px; font-size: var(--t-xl); line-height: 1.25; }
.calc-desc { margin-top: 8px; color: var(--muted); font-size: var(--t-sm); min-height: 3.5em; }
.calc-foot { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 20px; }
.calc-label { font-size: var(--t-xs); color: var(--muted); transition: color 0.3s; }
.done-btn { position: relative; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; transition: background-color 0.35s var(--ease), transform 0.2s var(--ease); }
.done-btn > svg { grid-area: 1 / 1; }
.done-btn .spin { width: 64px; height: 64px; animation: spin 1s linear infinite; }
.done-btn .check { width: 26px; height: 26px; color: var(--bg); opacity: 0; transform: scale(0.5); transition: opacity 0.3s, transform 0.45s var(--ease); }
.done-btn.ready { background: var(--accent); cursor: pointer; }
.done-btn.ready .spin { display: none; }
.done-btn.ready .check { opacity: 1; transform: none; }
.done-btn.ready:active { transform: scale(0.94); }
.calc-foot.ready .calc-label { color: var(--ink); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 结果 ---------- */
.r-universe { font-size: var(--t-xs); color: var(--muted); }
.r-universe b { color: var(--ink); font-weight: 400; }
.r-type { margin-top: 28px; font-size: var(--t-hero); line-height: 1.1; }
.r-type small { display: block; font-size: var(--t-xs); color: var(--muted); margin-bottom: 12px; }
.r-16 { margin-top: 16px; display: flex; align-items: baseline; gap: 10px; }
.r-16 b { font-size: var(--t-xl); letter-spacing: 0.1em; }
.r-16 span { font-size: var(--t-sm); color: var(--muted); }
.r-letters { margin-top: 2px; font-size: var(--t-xs); color: var(--faint); }
.r-letters i { font-style: normal; margin: 0 6px; }
.r-slogan { margin-top: 18px; font-size: var(--t-lg); line-height: 1.45; }
.r-desc { margin-top: 12px; color: var(--muted); }
.r-desc + .r-desc { margin-top: 8px; }

.bars { margin-top: 28px; display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 5.5em 1fr 3em; align-items: center; gap: 10px; font-size: var(--t-sm); }
.bar-row span:last-child { text-align: right; font-size: var(--t-xs); color: var(--muted); }
.bar { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--ink); transform-origin: left; animation: grow 1.1s var(--ease) both; }
@keyframes grow { from { transform: scaleX(0); } }

.sec { margin-top: 64px; }
.sec-title { font-size: var(--t-xl); line-height: 1.25; }
.sec-lead { margin-top: 6px; color: var(--muted); font-size: var(--t-sm); }
.sec p + p { margin-top: 10px; }
.sub-title { margin-top: 36px; font-size: var(--t-lg); }

.mask { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: var(--radius); overflow: hidden; }
.mask > div { padding: 16px; background: var(--surface); }
.mask span { font-size: var(--t-xs); color: var(--faint); }
.mask p { margin-top: 6px; font-size: var(--t-sm); line-height: 1.6; }
.sec .mask { margin-top: 22px; }
.portrait { margin-top: 20px; }
.portrait p { color: var(--muted); }
.portrait p + p { margin-top: 12px; }

.echo { list-style: none; padding: 0; margin-top: 12px; }
.echo li { padding: 18px 0; border-top: 1px solid var(--line); }
.echo li:last-child { border-bottom: 1px solid var(--line); }
.echo q { display: block; font-size: var(--t-lg); line-height: 1.4; quotes: "你选了「" "」"; }
.echo p { margin-top: 8px; font-size: var(--t-sm); color: var(--muted); }

.blind { list-style: none; padding: 0; margin-top: 12px; counter-reset: blind; }
.blind li { position: relative; padding: 12px 0 12px 2.6em; border-top: 1px solid var(--line); font-size: var(--t-sm); }
.blind li:last-child { border-bottom: 1px solid var(--line); }
.blind li::before { counter-increment: blind; content: counter(blind, decimal-leading-zero); position: absolute; left: 0; top: 13px; font-family: var(--mono); font-size: var(--t-xs); color: var(--faint); }

.match { margin-top: 10px; font-size: var(--t-sm); color: var(--muted); }
.match b { color: var(--ink); font-family: var(--mono); font-weight: 400; letter-spacing: 0.08em; margin-right: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.tags span { font-size: var(--t-xs); padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); }
.pair { margin-top: 20px; display: grid; gap: 20px; }
.pair h3 { font-size: var(--t-md); }
.pair p { margin-top: 6px; color: var(--muted); font-size: var(--t-sm); }
.script { margin-top: 28px; display: grid; gap: 16px; }
.script dt { font-size: var(--t-xs); color: var(--faint); }
.script dd { margin: 4px 0 0; font-size: var(--t-lg); line-height: 1.45; }
.script div:last-child dd { color: var(--accent); }
.tip { margin-top: 24px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: var(--t-sm); color: var(--muted); }
.tip b { color: var(--ink); font-weight: 600; }

.chart { margin-top: 20px; width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-size: 10px; fill: var(--faint); }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.2s 0.2s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.hist-name { margin-top: 18px; font-size: var(--t-md); font-weight: 600; }

.nodes .age { font-size: var(--t-xs); color: var(--muted); padding-top: 2px; }

.jobs { list-style: none; padding: 0; margin-top: 16px; counter-reset: job; }
.jobs li { padding: 14px 0; border-top: 1px solid var(--line); }
.jobs li:last-child { border-bottom: 1px solid var(--line); }
.jobs b { display: block; font-size: var(--t-md); font-weight: 600; }
.jobs b::before { counter-increment: job; content: counter(job, decimal-leading-zero); display: inline-block; width: 2.6em; font-family: var(--mono); font-size: var(--t-xs); font-weight: 400; color: var(--faint); }
.jobs span { display: block; margin-top: 2px; padding-left: 2.6em; color: var(--muted); font-size: var(--t-sm); }

.fork { margin-top: 20px; padding: 16px 18px; border-radius: var(--radius); border: 1px solid var(--accent); }
.fork span { font-size: var(--t-xs); color: var(--accent); }
.fork p { margin-top: 6px; font-size: var(--t-sm); color: var(--muted); }
.fork b { color: var(--ink); font-weight: 600; }
.lifeline { margin-top: 28px; }
.lifeline h3 { font-size: var(--t-md); display: flex; align-items: center; gap: 10px; }
.lifeline h3 i { width: 18px; height: 2px; border-radius: 2px; flex: none; }
.lifeline h3 em { font-style: normal; font-weight: 400; color: var(--muted); font-size: var(--t-xs); }
.lifeline h3 .odds { margin-left: auto; font-size: var(--t-lg); font-variant-numeric: tabular-nums; }
.lifeline h3 .top { flex: none; padding: 0 8px; border-radius: 999px; background: var(--accent); color: var(--bg); font-size: var(--t-xs); font-weight: 600; line-height: 1.6; }
.odds-note { margin-top: 20px; font-size: var(--t-xs); color: var(--faint); }

/* ---------- 锁 ---------- */
.locked { margin-top: 64px; }
.locked-list { list-style: none; padding: 0; display: grid; gap: 24px; }
.locked-list h3 { font-size: var(--t-lg); display: flex; align-items: center; gap: 8px; }
.locked-list h3 svg { flex: none; color: var(--faint); }
.ghost { margin-top: 10px; display: grid; gap: 8px; filter: blur(5px); opacity: 0.45; user-select: none; }
.ghost span { height: 12px; border-radius: 6px; background: var(--muted); }
.paywall {
  margin-top: 40px;
  padding: 24px 20px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--line);
}
.paywall h2 { font-size: var(--t-xl); }
.paywall h2 span { color: var(--accent); }
.paywall p { margin-top: 8px; color: var(--muted); font-size: var(--t-sm); }
.paywall p b { color: var(--ink); font-weight: 600; }
.code-row { display: flex; gap: 8px; margin-top: 18px; }
.code-row input {
  flex: 1; min-width: 0;
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg);
  font-family: var(--mono);
  font-size: var(--t-md); letter-spacing: 0.18em;
  text-transform: uppercase;
}
.code-row input::placeholder { font-family: var(--sans); color: var(--faint); letter-spacing: 0.04em; text-transform: none; }
.code-row input:focus { outline: none; border-color: var(--accent); }
.code-row button {
  flex: none;
  padding: 0 20px;
  border-radius: var(--radius);
  background: var(--ink); color: var(--bg);
  font-weight: 600;
}
.code-err { margin-top: 10px; font-size: var(--t-xs); color: var(--accent); min-height: 1.5em; }

/* ---------- 尾部 ---------- */
.share-hint { margin-top: 64px; text-align: center; font-size: var(--t-lg); }
.share-hint span { display: block; margin-top: 4px; font-family: var(--sans); font-size: var(--t-xs); letter-spacing: 0; color: var(--muted); }
.again { display: block; margin: 20px auto 0; padding: 10px 18px; font-size: var(--t-sm); color: var(--muted); text-decoration: underline; text-underline-offset: 4px; }
.disclaimer { margin-top: 36px; font-size: var(--t-xs); line-height: 1.7; color: var(--faint); text-align: center; }

.screen { animation: screen-in 0.5s var(--ease) both; }
@keyframes screen-in { from { opacity: 0; transform: translateY(14px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; }
  .draw { stroke-dashoffset: 0; }
}

/* ============ 工具 ============ */
const $ = (s) => document.querySelector(s);
const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const SALT = 'pl-2026-u7';
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function checkCode(raw) {
  const c = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length !== 8 || [...c].some((ch) => !ALPHABET.includes(ch))) return false;
  const h = fnv1a(c.slice(0, 6) + SALT);
  return c[6] === ALPHABET[h % 31] && c[7] === ALPHABET[(h >>> 8) % 31];
}
function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }

/* ============ 背景时间线 ============ */
const lines = (() => {
  const cv = $('#bg');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = mulberry32(20261105);
  const strands = Array.from({ length: 46 }, () => ({
    slope: (rand() - 0.55) * 0.9,
    amp: 10 + rand() * 40,
    freq: 0.004 + rand() * 0.01,
    phase: rand() * Math.PI * 2,
    speed: 0.15 + rand() * 0.35,
    alpha: 0.06 + rand() * 0.16,
  }));
  const hero = { slope: -0.3, amp: 26, freq: 0.007, phase: 1.2, speed: 0.25 };
  let w, h, dpr, t0 = performance.now(), mode = 'calm', modeAt = 0, raf;
  const css = getComputedStyle(document.documentElement);
  const primary = css.getPropertyValue('--muted').trim();
  const accent = css.getPropertyValue('--accent').trim();

  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function path(s, t, spread) {
    const ox = -20, oy = h * 0.4;
    ctx.beginPath();
    for (let x = ox; x <= w + 20; x += 8) {
      const k = (x - ox) / (w + 40);
      const y = oy + (s.slope * (x - ox) + Math.sin(x * s.freq + s.phase + t * s.speed) * s.amp * k) * spread;
      x === ox ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
  }
  function frame(now) {
    const t = reduce ? 0 : (now - t0) / 1000;
    ctx.clearRect(0, 0, w, h);
    if (mode === 'calm') return;
    let spread = 1, heroA = 0.9, fast = 1;
    if (mode === 'calc') {
      const p = Math.min(1, (now - modeAt) / 3000);
      fast = 4;
      spread = 1 - 0.85 * p * p;
      heroA = 0.3 + 0.7 * p;
    } else if (mode === 'result') {
      spread = 0.9; heroA = 0.35;
    }
    ctx.lineWidth = 1;
    for (const s of strands) {
      ctx.strokeStyle = primary;
      ctx.globalAlpha = s.alpha * (mode === 'result' ? 0.5 : 1);
      path(s, t * fast, spread);
      ctx.stroke();
    }
    ctx.globalAlpha = heroA;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    path(hero, t * fast, mode === 'calc' ? 1 : 1);
    ctx.stroke();
    ctx.globalAlpha = 1;
    if (!reduce && !document.hidden) raf = requestAnimationFrame(frame);
  }
  function start() { cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  addEventListener('resize', () => { size(); start(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
  size(); start();
  return { set(m) { mode = m; modeAt = performance.now(); start(); } };
})();

/* ============ 星轨漩涡：进入宇宙之后的世界（原创绘制） ============ */
const vortex = (() => {
  const cv = $('#vortex');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, cx, cy, r0, parts = [], raf = 0, running = false, last = 0;
  const TILT = (-24 * Math.PI) / 180, LIT = (150 * Math.PI) / 180;
  const cosT = Math.cos(TILT), sinT = Math.sin(TILT);

  function project(r, th) {
    const x = r * Math.cos(th), y = r * Math.sin(th) * 0.74;
    return [cx + x * cosT - y * sinT, cy + x * sinT + y * cosT];
  }

  function setup() {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = w * 0.68; cy = h * 0.52; r0 = Math.min(w, h) * 0.36;
    const rnd = mulberry32(7);
    const rMax = Math.hypot(w, h);
    const n = Math.round(Math.min(7000, (w * h) / 42));
    parts = Array.from({ length: n }, () => {
      const r = r0 * 0.5 + (rMax - r0 * 0.5) * Math.pow(rnd(), 0.9);
      const c = rnd();
      return {
        r, th: rnd() * Math.PI * 2,
        w: ((0.5 + rnd() * 0.5) / Math.pow(r / r0 + 0.5, 1.3)) * 0.016,
        lw: 0.6 + rnd() * 0.9,
        band: Math.exp(-(((r - r0 * 1.15) / (r0 * 0.75)) ** 2)),
        star: 0.18 + rnd() * 0.4,
        col: c < 0.06 ? 1 : c < 0.09 ? 2 : 0,
      };
    });
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
  }

  // 每颗粒子画成一小段弧（星轨），按颜色和亮度分桶，一桶一次 stroke
  const COLS = ['236,238,246', '255,178,100', '130,225,235'];
  function paint(dt) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    ctx.fillRect(0, 0, w, h);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r0 * 1.25);
    g.addColorStop(0, 'rgba(255,255,255,0.16)');
    g.addColorStop(0.6, 'rgba(230,232,245,0.08)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    // 被照亮的那一侧“隧道壁”
    const [lx, ly] = project(r0 * 0.95, LIT);
    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, r0 * 0.95);
    lg.addColorStop(0, 'rgba(255,255,255,0.14)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, w, h);
    const buckets = new Map();
    for (const p of parts) {
      p.th += p.w * dt;
      const lit = Math.max(0, Math.cos(p.th - LIT));
      const a = Math.min(1, p.star * 0.45 + p.band * (0.06 + 1.25 * lit * lit));
      const key = p.col * 10 + Math.min(9, Math.round(a * 9));
      let list = buckets.get(key);
      if (!list) buckets.set(key, (list = []));
      list.push(p);
    }
    ctx.lineCap = 'round';
    for (const [key, list] of buckets) {
      const col = COLS[Math.floor(key / 10)], a = (key % 10) / 9;
      if (a < 0.05) continue;
      ctx.strokeStyle = `rgba(${col},${a.toFixed(2)})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const p of list) {
        const [x1, y1] = project(p.r, p.th - p.w * 12);
        const [x2, y2] = project(p.r, p.th);
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      }
      ctx.stroke();
    }
  }

  function frame(now) {
    const dt = Math.min(48, now - (last || now)) / 16.7;
    last = now;
    paint(dt);
    if (running && !document.hidden) raf = requestAnimationFrame(frame);
  }

  function run(on) {
    running = on;
    cancelAnimationFrame(raf);
    if (!on) return;
    paint(0);
    if (reduce) { running = false; return; }
    last = 0;
    raf = requestAnimationFrame(frame);
  }
  let t;
  addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { setup(); if (running) run(true); }, 150); });
  document.addEventListener('visibilitychange', () => { if (running && !document.hidden) run(true); });
  setup();
  return { run };
})();

  const next = CHAPTERS[k + 1];
  const from = CHAPTERS[k].end;
  $('#ch-break').innerHTML = `
    <div class="ch-dots">${CHAPTERS.map((_, i) => `<i class="${i <= k ? 'on' : ''}"></i>`).join('')}</div>
    <p class="ch-done">第${CN[k]}重宇宙 · 同步完成</p>
    <h2 class="ch-title" tabindex="-1">${CHAPTERS[k].name}</h2>
    <p class="ch-reward"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>${CHAPTERS[k].reward}</p>
    <div class="ch-next">
      <span>即将跃迁 · ${next.end - from} 题</span>
      <b>第${CN[k + 1]}重宇宙：${next.name}</b>
    </div>
    <button class="cta" id="ch-go">跃迁到下一重宇宙</button>`;
  $('#q-zone').hidden = true;
  $('#ch-break').hidden = false;
  $('#p-fill').style.width = `${(step / TOTAL) * 100}%`;
  $('#ch-go').addEventListener('click', goNext);
  $('#ch-break .ch-title').focus({ preventScroll: true });
}

// 性格题的选项按题号固定打乱，避免一眼看出“从轻到重”；现实题保持原顺序
function optionOrder(i, q) {
  const idx = q.o.map((_, k) => k);
  if (i >= Q.length) return idx;
  const rnd = mulberry32(i * 7919 + 13);
  for (let k = idx.length - 1; k > 0; k--) {
    const j = Math.floor(rnd() * (k + 1));
    [idx[k], idx[j]] = [idx[j], idx[k]];
  }
  return idx;
}

function renderQ(dir) {
  const q = current();
  const zone = $('#q-zone');
  zone.classList.remove('from-left', 'from-right');
  void zone.offsetWidth;
  if (dir) zone.classList.add(dir === 'prev' ? 'from-left' : 'from-right');
  const isFact = step >= Q.length;
  const ci = chapterOf(step);
  const start = ci ? CHAPTERS[ci - 1].end : 0;
  $('#q-zone').hidden = false;
  $('#ch-break').hidden = true;
  $('#p-count').textContent = `${pad(step + 1)} / ${TOTAL}`;
  $('#p-label').textContent = `第${CN[ci]}重宇宙 · ${CHAPTERS[ci].name}`;
  $('#p-fill').style.width = `${(step / TOTAL) * 100}%`;
  $('#q-tag').textContent = isFact ? '最后 3 个现实问题，让推演更准' : `${step - start + 1} / ${CHAPTERS[ci].end - start}`;
  $('#q-text').textContent = q.t;
  const ul = $('#opts');
  ul.innerHTML = '';
  optionOrder(step, q).forEach((i) => {
    const o = q.o[i];
    // 谈过恋爱的人，“最长一段”不再显示“没谈过”
    if (q.d === 'longest' && i === 0) return;
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = o;
    if (answers[step] === i) b.classList.add('picked');
    b.addEventListener('click', () => pick(i, b));
    li.appendChild(b);
    ul.appendChild(li);
  });
  ul.querySelectorAll('li').forEach((li, i) => { li.firstChild.style.animationDelay = `${i * 0.04}s`; });
  updatePager();
}

let busy = false;
let seenBreaks = new Set();
const COUNT = Q.length + 1, LONGEST = Q.length + 2;
const skipLongest = () => answers[COUNT] === 0;

// 第一道还没答的题（没谈过恋爱时跳过“最长一段”）
function frontier() {
  for (let i = 0; i < TOTAL; i++) {
    if (i === LONGEST && skipLongest()) continue;
    if (answers[i] === undefined) return i;
  }
  return TOTAL;
}

function updatePager() {
  const f = frontier();
  const behind = f > step + 1;
  $('#pager').hidden = brk !== null;
  $('#pg-prev').disabled = step === 0;
  $('#pg-next').disabled = answers[step] === undefined;
  $('#pg-jump').hidden = !behind;
  $('#pg-hint').hidden = behind;
  $('#pg-jump').textContent = f >= TOTAL ? '全部答完 · 查看结果 ›' : `回到第 ${f + 1} 题 ›`;
}

function pick(i, btn) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('.opt').forEach((b) => b.classList.remove('picked'));
  btn.classList.add('picked');
  answers[step] = i;
  // 改了“谈过几段”，同步“最长一段”
  if (step === COUNT) {
    if (i === 0) answers[LONGEST] = 0;
    else if (answers[LONGEST] === 0) answers[LONGEST] = undefined;
  }
  updatePager();
  setTimeout(() => { busy = false; goNext(); }, 260);
}

let flipping = false;
function flipTo(fn) {
  if (flipping) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return fn();
  flipping = true;
  document.body.classList.add('flip-out');
  setTimeout(() => {
    fn();
    document.body.classList.remove('flip-out');
    document.body.classList.add('flip-in');
    setTimeout(() => { document.body.classList.remove('flip-in'); flipping = false; }, 560);
  }, 400);
}

function goNext() {
  if (flipping) return;
  if (brk !== null) { flipTo(() => { brk = null; renderQ(); }); return; }
  if (answers[step] === undefined) return;
  step++;
  if (step === LONGEST && skipLongest()) step++;
  if (step >= TOTAL) return finish();
  const k = CHAPTERS.findIndex((c) => c.end === step);
  if (k > -1 && k < CHAPTERS.length - 1 && !seenBreaks.has(k)) {
    seenBreaks.add(k); brk = k; renderBreak(k); updatePager(); return;
  }
  renderQ('next');
}

function goPrev() {
  if (flipping) return;
  if (brk !== null) { brk = null; step--; renderQ('prev'); return; }
  if (step === 0) return;
  step--;
  if (step === LONGEST && skipLongest()) step--;
  renderQ('prev');
}

function jumpToFrontier() {
  const f = frontier();
  if (f >= TOTAL) return finish();
  brk = null; step = f;
  renderQ('next');
}

$('#pg-prev').addEventListener('click', goPrev);
$('#pg-next').addEventListener('click', goNext);
$('#pg-jump').addEventListener('click', jumpToFrontier);

// 左右滑动翻页（键盘左右键也行）
(() => {

  const quiz = $('#quiz');
  quiz.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  quiz.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (busy || Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx) * 0.7) return;
    if (dx < 0) goNext(); else goPrev();
  }, { passive: true });
  addEventListener('keydown', (e) => {
    if (document.body.dataset.screen !== 'quiz' || busy) return;
    if (e.key === 'ArrowRight') goNext();
    if (e.key === 'ArrowLeft') goPrev();
  });
})();

$('#start').addEventListener('click', () => {

$('#back').addEventListener('click', () => {

/* ============ 结算动画：7 个节点的圆环 ============ */
const ICON = (inner) => `<svg viewBox="0 0 64 64" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const STAGES = [

const RING = { cx: 150, cy: 150, r: 118, start: -80, step: 45 };

function ringPoint(deg) {
  const a = (deg * Math.PI) / 180;
  return [RING.cx + RING.r * Math.cos(a), RING.cy + RING.r * Math.sin(a)];
}

function buildRing() {
  const [sx, sy] = ringPoint(RING.start);

    return `<g class="node" data-i="${i + 1}"><circle cx="${x}" cy="${y}" r="11" fill="oklch(0.3 0 0)" stroke="transparent" stroke-width="1.5"/><text x="${x}" y="${y + 3.6}" text-anchor="middle">${i + 1}</text></g>`;

      pathLength="360" stroke-dasharray="0 360" transform="rotate(${RING.start} 150 150)"/>
    <circle cx="${sx}" cy="${sy}" r="4" fill="var(--ink)"/>
    ${nodes}`;
}

function runRing(no) {

$('#done-btn').addEventListener('click', () => renderResult());

/* ============ 计算 ============ */
function universeNo(a) {
  return (fnv1a(a.join('-') + 'universe') % 9999999) + 1;
}

function compute(a) {
  const s = { A: 0, V: 0, E: 0, N: 0, F: 0, J: 0 };
  Q.forEach((q, i) => { s[q.d] += a[i]; });
  const hi = (k) => s[k] >= MAX[k] / 2;
  const attach = hi('A') ? (hi('V') ? 'comet' : 'tide') : (hi('V') ? 'orbit' : 'star');
  const career = (hi('N') ? 'O' : 'o') + (hi('E') ? 'E' : 'e') + (hi('J') ? 'C' : 'c');
  const type = (hi('E') ? 'E' : 'I') + (hi('N') ? 'N' : 'S') + (hi('F') ? 'F' : 'T') + (hi('J') ? 'J' : 'P');
  const f = a.slice(Q.length);
  const age = AGE_MID[f[0]];
  const count = f[1], longest = f[2];
  let hist;
  if (count === 0) hist = 'prologue';
  else if (longest >= 3) hist = count === 1 ? 'deep' : 'rough';
  else hist = count === 1 ? 'trial' : 'spark';
  return { s, hiA: hi('A'), hiV: hi('V'), attach, career, type, age, count, longest, hist, no: universeNo(a), seed: fnv1a(a.join('')) };
}

const pct = (k, v) => Math.round(6 + (v / MAX[k]) * 90);
const LETTER_DIM = { E: 'E', I: 'E', N: 'N', S: 'N', F: 'F', T: 'F', J: 'J', P: 'J' };
// 某个字母的倾向强度：50%（两边持平）→ 100%（非常明显）
function letterPct(R, l) {
  const k = LETTER_DIM[l], p = R.s[k] / MAX[k];
  return Math.round(Math.max(p, 1 - p) * 100);
}
// 恋爱人格纯度
function purity(R) {
  const a = R.s.A / MAX.A, v = R.s.V / MAX.V;
  const p = { star: (2 - a - v) / 2, tide: (a + 1 - v) / 2, orbit: (1 - a + v) / 2, comet: (a + v) / 2 }[R.attach];
  return Math.min(99, Math.max(51, Math.round(p * 100)));
}
// 挑出最能代表这个人的 3 个回答（最极端的），引用回去
function echoes(R, a) {
  const picks = [];
  ['A', 'V', 'F', 'E', 'N', 'J'].forEach((d, pri) => {
    let best = -1, ext = 0;
    Q.forEach((q, i) => { if (q.d === d && Math.abs(a[i] - 2) > ext) { ext = Math.abs(a[i] - 2); best = i; } });
    if (best > -1) picks.push({ d, i: best, ext, pri });
  });
  // 只引用态度鲜明的回答（最轻或最重的选项）；不够 2 条时才用次一级的补
  const strong = picks.filter((p) => p.ext === 2);
  const pool = strong.length >= 2 ? strong : picks.filter((p) => p.ext >= 1);
  return pool
    .sort((x, y) => y.ext - x.ext || x.pri - y.pri)
    .slice(0, 3)
    .map(({ d, i }) => ({ quote: Q[i].o[a[i]], text: ECHO[d + (a[i] > 2 ? '+' : '-')] }));
}

/* 最合拍的人格：内外互补、节奏互补，看世界和做决定的方式相同 */
const matchType = (t) => (t[0] === 'E' ? 'I' : 'E') + t[1] + t[2] + (t[3] === 'J' ? 'P' : 'J');

function blindSpots(R) {
  const t = R.type;
  const list = [BLIND[R.hiA ? 'A+' : 'A-'], BLIND[R.hiV ? 'V+' : 'V-'], BLIND[t[2]], BLIND[t[3]]];
  list.push(BLIND.common[R.seed % BLIND.common.length]);
  return list;
}

/* ============ 图表 ============ */
function smooth(pts) {
  return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
}

function loveChart(R) {
  const rnd = mulberry32(R.seed);
  const base = 150, NOW = 150, END = 330;
  const n = [0, 1, 2 + (R.seed % 2), 4][R.count];
  const hMax = [0, 34, 52, 74, 92][R.longest];
  const wMax = [0, 7, 11, 16, 22][R.longest];
  const big = Math.floor(rnd() * n);
  const bumps = Array.from({ length: n }, (_, i) => {
    const k = i === big ? 1 : 0.35 + rnd() * 0.3;
    return { c: 22 + (i + 0.5) * (118 / n), h: hMax * k, w: wMax * (i === big ? 1 : 0.6) };
  });
  const yPast = (x) => {
    if (!n) return base - 4 - 3 * Math.sin(x / 9);
    return base - bumps.reduce((acc, b) => acc + b.h * Math.exp(-((x - b.c) ** 2) / (2 * b.w * b.w)), 0);
  };
  const target = {
    star: (t) => base - (30 + 82 * t) - 4 * Math.sin(t * 12),
    tide: (t) => base - (26 + 84 * t) - 30 * (1 - t) * Math.sin(t * 22),
    orbit: (t) => base - (12 + 96 / (1 + Math.exp(-(t - 0.55) * 11))),
    comet: (t) => base - (24 + 74 * t) - 62 * Math.exp(-((t - 0.16) ** 2) / 0.004) + 22 * Math.exp(-((t - 0.34) ** 2) / 0.003),
  }[R.attach];
  const y0 = yPast(NOW);
  const yFut = (x) => {
    const t = (x - NOW) / (END - NOW);
    const s = Math.min(1, t / 0.14);
    const e = s * s * (3 - 2 * s);
    return Math.max(16, Math.min(168, y0 * (1 - e) + target(t) * e));
  };
  const past = [], fut = [];
  for (let x = 10; x <= NOW; x += 2.5) past.push([x, yPast(x)]);
  for (let x = NOW; x <= END; x += 2.5) fut.push([x, yFut(x)]);
  const nodeT = [0.24, 0.55, 0.88];
  const nodes = nodeT.map((t, i) => {
    const x = NOW + t * (END - NOW);
    const y = yFut(x);
    return `<circle cx="${x}" cy="${y}" r="9" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="${x}" y="${y + 3.8}" text-anchor="middle" style="fill:var(--accent);font-weight:700">${i + 1}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 340 196" role="img" aria-label="你的爱情线：过去与未来的起伏曲线">
    <line x1="10" y1="${base + 12}" x2="${END}" y2="${base + 12}" stroke="var(--line)"/>
    <line x1="${NOW}" y1="14" x2="${NOW}" y2="${base + 12}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <text x="10" y="${base + 30}">过去</text>
    <text x="${NOW}" y="${base + 30}" text-anchor="middle" style="fill:var(--ink)">现在 · ${R.age}岁</text>
    <text x="${END}" y="${base + 30}" text-anchor="end">未来</text>
    <path d="${smooth(past)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="draw" pathLength="1" d="${smooth(fut)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${nodes}
  </svg>`;
}

function lifeChart(R) {
  const rnd = mulberry32(R.seed + 7);
  const ox = 22, oy = 84, END = 326;
  const curve = (yEnd) => {
    const pts = [];
    for (let x = ox; x <= END; x += 3) {
      const k = Math.min(1, (x - ox) / 190);
      const e = k * k * (3 - 2 * k);
      pts.push([x, oy + (yEnd - oy) * e]);
    }
    return smooth(pts);
  };
  const faint = Array.from({ length: 16 }, () => {
    const yEnd = 8 + rnd() * 152;
    return `<path d="${curve(yEnd)}" fill="none" stroke="var(--ink)" stroke-opacity="${0.05 + rnd() * 0.08}" stroke-width="1"/>`;
  }).join('');
  const main = [[24, 'var(--accent)', 2.5], [84, 'var(--ink)', 2], [144, 'var(--muted)', 2]];
  const yAt = (yEnd, x) => { const k = Math.min(1, (x - ox) / 190); return oy + (yEnd - oy) * k * k * (3 - 2 * k); };
  const strong = main.map(([y, c, w]) => `<path class="draw" pathLength="1" d="${curve(y)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>` +
    [150, 232, 314].map((x) => `<circle cx="${x}" cy="${yAt(y, x)}" r="3.5" fill="${c}"/>`).join('')).join('');
  return `<svg class="chart" viewBox="0 0 340 176" role="img" aria-label="从现在出发分岔的三条人生线">
    ${faint}${strong}
    <circle cx="${ox}" cy="${oy}" r="6" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/>
    <text x="${ox}" y="${oy + 24}" text-anchor="start" style="fill:var(--ink)">现在</text>
  </svg>`;
}

/* ============ 结果页 ============ */
const LOCK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

// 三条线的发生概率，由各维度分数决定
function lineOdds(R) {
  const n = R.s.N / MAX.N, j = R.s.J / MAX.J, v = R.s.V / MAX.V, a = R.s.A / MAX.A, e = R.s.E / MAX.E;
  return {
    main: Math.round(46 + j * 32 + (1 - n) * 8),
    brave: Math.round(22 + n * 28 + e * 10 + (1 - j) * 8),
    love: Math.round(30 + (1 - v) * 38 + (1 - Math.abs(a - 0.45)) * 12),
  };
}

// 按个人倾向微调节点年龄：想象力高的人更早出发，计划性低的人主线稍晚
function personalLines(R, J, T) {
  const n = R.s.N / MAX.N, j = R.s.J / MAX.J;
  const love = T.love.map(([off, txt], i) => [off, i === 0 ? LOVE_FIRST[R.hist] : txt]);
  return {
    main: J.main.map(([off, txt]) => [off + (j < 0.35 ? 1 : 0), txt]),
    brave: J.brave.map(([off, txt]) => [Math.max(1, off - (n > 0.7 ? 1 : 0)), txt]),
    love,
  };
}

function nodesList(items, age) {
  return `<ul class="nodes">${items.map(([off, txt]) => `<li><span class="age">${age + off}岁</span><span>${txt}</span></li>`).join('')}</ul>`;
}

function renderResult() {
  const R = compute(state.answers);
  const T = ATTACH[R.attach];
  const J = CAREER[R.career];
  const X = CAREER_X[R.career];
  const L = personalLines(R, J, T);
  const odds = lineOdds(R);
  const top = Object.keys(odds).reduce((x, y) => (odds[y] > odds[x] ? y : x));
  const badge = (k) => (k === top ? '<small class="top">最可能</small>' : '');
  const [shine, drain] = WORKPLACE[R.type[0] + R.type[3]];
  const [histName, histText] = HISTORY[R.hist];
  const [t16Name, t16Line] = TYPE16[R.type];
  const mt = matchType(R.type);
  const [mask, inner] = MASK[R.type[0] + (R.hiA ? '+' : '-')];
  const bars = [['A', '安全感需求'], ['V', '亲密距离感'], ['E', '社交能量'], ['N', '想象力'], ['F', '共情力'], ['J', '计划性']];

  const head = `
    <p class="r-universe">UNIVERSE <b>NO.${R.no.toLocaleString('en-US')}</b> · 你来自这里</p>
    <h1 class="r-type" tabindex="-1"><small>你的恋爱人格 · ${T.name.slice(0, 2)}纯度 ${purity(R)}%</small>${T.name}恋人</h1>
    <p class="r-16"><b>${R.type}</b><span>${t16Name}</span></p>
    <p class="r-letters">${[...R.type].map((l) => `${l} ${letterPct(R, l)}%`).join('<i>·</i>')}</p>
    <p class="r-slogan">${T.slogan}</p>
    <p class="r-desc">${T.desc}</p>
    <p class="r-desc">${t16Line}</p>
    <div class="bars">${bars.map(([k, label], i) => `<div class="bar-row"><span>${label}</span><div class="bar"><i style="width:${pct(k, R.s[k])}%;animation-delay:${0.15 + i * 0.08}s"></i></div><span>${pct(k, R.s[k])}%</span></div>`).join('')}</div>`;

  const full = `
    <section class="sec">
      <h2 class="sec-title">深度画像：${R.type} × ${T.name}</h2>
      <p class="sec-lead">由你在三重宇宙里的 47 个选择交叉得出。</p>
      <div class="mask">
        <div><span>别人眼里的你</span><p>${mask}</p></div>
        <div><span>真实的你</span><p>${inner}</p></div>
      </div>
      <div class="portrait">${[...R.type].map((l) => `<p>${PORTRAIT[l][letterPct(R, l) >= 68 ? 0 : 1]}</p>`).join('')}</div>
      <h3 class="sub-title">你的选择出卖了你</h3>
      <ul class="echo">${echoes(R, state.answers).map((e) => `<li><q>${e.quote}</q><p>${e.text}</p></li>`).join('')}</ul>
      <h3 class="sub-title">你可能没意识到的 5 件事</h3>
      <ol class="blind">${blindSpots(R).map((b) => `<li>${b}</li>`).join('')}</ol>
    </section>

    <section class="sec">
      <h2 class="sec-title">最适合你的恋人类型</h2>
      <p class="match">和你最合拍的人格：<b>${mt}</b> ${TYPE16[mt][0]}</p>
      <div class="tags">${T.tags.map((t) => `<span>${t}</span>`).join('')}</div>
      <div class="pair">
        <div><h3>对的人</h3><p>${T.fit}</p></div>
        <div class="warn"><h3>要小心的人</h3><p>${T.avoid}</p></div>
      </div>
      <dl class="script">
        <div><dt>你最想听到的一句话</dt><dd>${SCRIPT[R.attach][0]}</dd></div>
        <div><dt>你最怕的事</dt><dd>${SCRIPT[R.attach][1]}</dd></div>
        <div><dt>你不会说出口的话</dt><dd>${SCRIPT[R.attach][2]}</dd></div>
      </dl>
      <p class="tip"><b>给你的一句话：</b>${T.tip}</p>
    </section>

    <section class="sec">
      <h2 class="sec-title">你的爱情线</h2>
      <p class="sec-lead">左边是你走过的路，右边是这条线在你的宇宙里大概率会怎么走。</p>
      ${loveChart(R)}
      <p class="hist-name">过去：<span>${histName}</span></p>
      <p class="r-desc" style="margin-top:6px">${histText}</p>
      ${nodesList(L.love, R.age)}
    </section>

    <section class="sec">
      <h2 class="sec-title">你是「${J.name}」，适合这样的工作</h2>
      <p class="sec-lead">${J.slogan}</p>
      <h3 class="sub-title">你的工作天赋</h3>
      <div class="tags">${X.talents.map((t) => `<span>${t}</span>`).join('')}</div>
      <h3 class="sub-title">最适合你的 3 个方向</h3>
      <ol class="jobs">${X[R.type[2]].map(([j, r]) => `<li><b>${j}</b><span>${r}</span></li>`).join('')}</ol>
      <p class="tip">${WORK_FT[R.type[2]]}</p>
      <div class="mask">
        <div><span>让你发光的地方</span><p>${shine}</p></div>
        <div><span>让你枯萎的地方</span><p>${drain}</p></div>
      </div>
      <h3 class="sub-title">你和钱的关系</h3>
      <p class="r-desc">${MONEY[R.type[1] + R.type[3]]}</p>
      <h3 class="sub-title">你最容易踩的坑</h3>
      <p class="r-desc">${X.pitfall}</p>
    </section>

    <section class="sec">
      <h2 class="sec-title">平行宇宙里的三条人生线</h2>
      <p class="sec-lead">在 1000 万种可能里，离你最近的三条。</p>
      <div class="fork">
        <span>岔路口 · ${R.age + 2} 岁前后</span>
        <p>你会面对一个选择：<b>${X.fork}</b>。你怎么选，决定了你会走上哪一条线。</p>
      </div>
      ${lifeChart(R)}
      <div class="lifeline"><h3><i style="background:var(--ink)"></i>主线<em>按现在的节奏走下去</em>${badge('main')}<b class="odds">${odds.main}%</b></h3>${nodesList(L.main, R.age)}</div>
      <div class="lifeline"><h3><i style="background:var(--muted)"></i>支线<em>如果你选了更勇敢的那条</em>${badge('brave')}<b class="odds">${odds.brave}%</b></h3>${nodesList(L.brave, R.age)}</div>
      <div class="lifeline"><h3><i style="background:var(--accent)"></i>感情线<em>如果你遇见对的人</em>${badge('love')}<b class="odds">${odds.love}%</b></h3>${nodesList(L.love, R.age)}</div>
      <p class="odds-note">百分比是这条线在你的宇宙里出现的概率，由你的 50 个回答推算。</p>
    </section>

    <p class="share-hint">截图晒出你的宇宙编号<span>看看朋友来自哪个宇宙，你们的线会不会交汇</span></p>`;

  const locked = `
    <section class="locked">
      <ul class="locked-list">
        ${[`深度画像：别人眼里的你 vs 真实的你`, '你的选择出卖了你：3 个最能代表你的回答', '你可能没意识到的 5 件事', `最适合你的恋人类型（和 ${mt} 最合拍）`, '你的爱情线（过去 + 未来走势）', `你是「${J.name}」：工作天赋、3 个方向、你和钱的关系`, '人生岔路口 + 三条人生线（含发生概率）'].map((t) => `
          <li><h3>${LOCK}${t}</h3><div class="ghost"><span style="width:92%"></span><span style="width:78%"></span><span style="width:60%"></span></div></li>`).join('')}
      </ul>
      <div class="paywall">
        <h2>解锁完整档案 <span>¥1</span></h2>
        <p>在小红书搜索店铺 <b>「${STORE_NAME}」</b>，拍下后会自动发送 8 位解锁码。回到这里输入即可，测试结果会一直保存在这台手机上。</p>
        <form class="code-row" id="code-form" autocomplete="off">
          <input id="code" inputmode="text" maxlength="12" placeholder="输入解锁码" aria-label="解锁码" autocapitalize="characters" spellcheck="false">
          <button type="submit">解锁</button>
        </form>
        <p class="code-err" id="code-err" aria-live="polite"></p>
      </div>
    </section>`;

  $('#result-body').innerHTML = head + (state.unlocked ? full : locked) + `
    <button class="again" id="again">重新测一次</button>
    <p class="disclaimer">本测试基于依恋理论与人格特质模型改编，结果仅供娱乐，<br>不构成心理诊断或任何人生建议。我们不收集你的任何个人信息。</p>`;

  show('result');
  lines.set('calm');

  $('#again').addEventListener('click', () => {
    state = { unlocked: state.unlocked };
    save(state);
    step = 0; answers = [];
    lines.set('calm');
    show('intro');
  });
  const form = $('#code-form');
  if (form) form.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('#code').value;
    if (checkCode(v)) {
      state.unlocked = true;
      save(state);
      renderResult();
      requestAnimationFrame(() => document.querySelector('.sec')?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    } else {
      $('#code-err').textContent = v.trim() ? '解锁码不对，检查一下有没有输错（不区分大小写）' : '先输入解锁码哦';
    }
  });
}

/* 之前测过：直接回到结果（从小红书买完码回来时用） */
if (state.answers && state.answers.length === TOTAL) {
  lines.set('calm');
  renderResult();
}
</script>
</body>
</html>
